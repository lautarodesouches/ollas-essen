name: Deploy Production
on:
  push:
    branches:
      - main

env:
  APP_NAME: "recetasconessen"
  APP_PORT: "3008"
  DEPLOY_PATH: "/home/runcloud/webapps/recetasconessen"
  NODE_VERSION: "24"
  PNPM_VERSION: "10"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: 1. Obtener código
        uses: actions/checkout@v4

      - name: 2. Crear archivo .env
        run: |
          echo "${{ secrets.ENV_PRODUCTION }}" > .env

      - name: 3. Instalar PNPM
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 4. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 5. Cache Next.js
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: 6. Instalar y Compilar
        run: |
          pnpm install --frozen-lockfile
          # Next.js lee el .env creado en el paso 2 automáticamente aquí
          pnpm run build

      - name: 7. Preparar Standalone
        run: |
          cp -r public .next/standalone/public
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/static
          
          # 💎 IMPORTANTE: Copiamos el .env para que viaje al servidor
          cp .env .next/standalone/.env

      - name: 8. Transferir archivos
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: runcloud
          key: ${{ secrets.SSH_KEY }}
          port: 22
          source: ".next/standalone/*"
          target: "${{ env.DEPLOY_PATH }}"
          strip_components: 2

      - name: 9. Reiniciar PM2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: runcloud
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e

            # --- DETECCIÓN NODE ---
            NODE_VER="${{ env.NODE_VERSION }}"
            LATEST_NODE=$(ls -d /home/runcloud/.nvm/versions/node/v$NODE_VER* | sort -V | tail -n 1)
            if [ -z "$LATEST_NODE" ]; then echo "❌ Error Node"; exit 1; fi
            export PATH="$LATEST_NODE/bin:$PATH"

            # --- AUTOCURACIÓN PM2 ---
            if ! command -v pm2 &> /dev/null; then npm install -g pm2; fi

            # --- CONFIGURACIÓN ---
            cd "${{ env.DEPLOY_PATH }}"
            PM2_NAME="${{ env.APP_NAME }}"
            PORT_NUM="${{ env.APP_PORT }}"

            if pm2 list | grep -q "$PM2_NAME"; then
              echo "🔄 Recargando $PM2_NAME..."
              # --update-env refresca cambios si modificaste el secreto
              pm2 reload "$PM2_NAME" --update-env
            else
              echo "🚀 Iniciando $PM2_NAME en puerto $PORT_NUM..."
              PORT=$PORT_NUM pm2 start server.js --name "$PM2_NAME"
            fi
            
            pm2 save
            echo "✅ Despliegue completado."
